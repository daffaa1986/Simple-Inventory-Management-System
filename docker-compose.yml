services:
  db:
    image: postgres:16-alpine
    container_name: stockify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockify}
      POSTGRES_DB: ${POSTGRES_DB:-stockify}
    volumes:
      # Named volume -> data tetap ada walau container dibuat ulang.
      - stockify_pgdata:/var/lib/postgresql/data
    ports:
      # Host port 5433 supaya tidak bentrok dengan PostgreSQL lokal di 5432.
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-stockify} -d ${POSTGRES_DB:-stockify}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - stockify

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stockify-backend
    restart: unless-stopped
    environment:
      # Konfigurasi database lewat environment variables.
      # (DATABASE_URL juga didukung oleh backend, lihat backend/main.py)
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-stockify}
      POSTGRES_USER: ${POSTGRES_USER:-stockify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockify}
      POSTGRES_CONNECT_TIMEOUT: "5"
    depends_on:
      db:
        # Backend baru start setelah PostgreSQL benar-benar siap.
        condition: service_healthy
    ports:
      # API FastAPI + dokumentasi /docs
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - stockify

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: stockify-frontend
    restart: unless-stopped
    depends_on:
      backend:
        # Frontend start setelah backend sehat.
        condition: service_healthy
    ports:
      # UI Stockify -> http://localhost:8080
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stockify

volumes:
  stockify_pgdata:
    name: stockify_pgdata

networks:
  stockify:
    name: stockify
    driver: bridge
