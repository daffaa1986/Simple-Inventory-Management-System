
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Inventory Management</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Stockify</h1>
    <span>Inventory Management System</span>
  </header>

  <main class="container">
    <section class="intro">
      <div>
        <h2>Inventory Dashboard</h2>
        <p>Kelola barang dan stok inventaris Anda.</p>
      </div>
      <button id="addBtn">+ Tambah Barang</button>
    </section>

    <section class="stats">
      <article class="stat-card">
        <p>Jenis Barang</p>
        <h3 id="totalItems">0</h3>
      </article>
      <article class="stat-card">
        <p>Total Stok</p>
        <h3 id="totalStock">0</h3>
      </article>
      <article class="stat-card">
        <p>Total Nilai Stok</p>
        <h3 id="totalValue">Rp0</h3>
      </article>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Daftar Barang</h2>
        <input id="searchInput" type="search"
          placeholder="Cari nama atau kategori...">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nama Barang</th>
              <th>Kategori</th>
              <th>Stok</th>
              <th>Harga</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="itemTable">
            <tr>
              <td colspan="6" class="empty">
                Belum ada data barang.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="panel form-panel" id="formPanel" hidden>
      <h2 id="formTitle">Tambah Barang</h2>

      <form id="itemForm">
        <label for="name">Nama Barang</label>
        <input id="name" required maxlength="100">

        <label for="category">Kategori</label>
        <input id="category" required maxlength="60">

        <label for="stock">Jumlah Stok</label>
        <input id="stock" type="number" min="0"
          step="1" required>

        <label for="price">Harga Satuan (Rp)</label>
        <input id="price" type="number" min="0"
          step="0.01" required>

        <div class="form-actions">
          <button type="submit" id="saveBtn">Simpan</button>
          <button type="button" class="secondary"
            id="cancelBtn">Batal</button>
        </div>
      </form>
    </section>

    <p id="message" role="status" aria-live="polite"></p>
  </main>

  <script src="config.js"></script>
  <script src="script/app.js"></script>
</body>
</html>
