server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Halaman & aset Stockify (HTML, CSS, JavaScript).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API FastAPI.
    # Browser memakai /api/... (satu origin dengan frontend) sehingga
    # tidak ada masalah CORS dan tidak memakai hostname internal container.
    location /api/ {
        # Resolver internal Docker: nama service di-resolve saat request,
        # jadi Nginx tetap benar walau IP container backend berubah.
        resolver 127.0.0.11 ipv6=off valid=10s;

        # PENTING: set harus SEBELUM rewrite, karena rewrite ... break
        # menghentikan fase rewrite (set setelahnya tidak dijalankan).
        set $backend_upstream backend:8000;

        # Buang prefix /api sebelum meneruskan ( /api/items -> /items ).
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://$backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Health check backend, juga lewat proxy.
    location = /health {
        resolver 127.0.0.11 ipv6=off valid=10s;

        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/health;

        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
